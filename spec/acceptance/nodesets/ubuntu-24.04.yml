---
HOSTS:
  ubuntu-24.04-x64:
    platform: ubuntu-24.04-x86_64
    roles:
      - agent
    hypervisor: <%= ENV.fetch('BEAKER_HYPERVISOR', 'vagrant') %>
    box: bento/ubuntu-24.04
    # Hack to get around `puppet` not being in the PATH
    shell_provisioner:
      path: "<%= File.expand_path(__dir__) %>/spec/acceptance/nodesets/ubuntu-workaround.sh"
CONFIG:
  type: aio
  puppet_collection: <%= ENV.fetch('BEAKER_PUPPET_COLLECTION', 'puppet8') %>
